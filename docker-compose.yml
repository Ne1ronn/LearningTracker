services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env.docker
    depends_on:
      - db
    restart: unless-stopped

  bot:
    build: .
    command: python -m telegram_bot.dispatcher
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:15
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: