name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learningtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learningtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
        ACCESS_SECRET_KEY: ${{ secrets.ACCESS_SECRET_KEY }}
        REFRESH_SECRET_KEY: ${{ secrets.REFRESH_SECRET_KEY }}
        ALGORITHM: ${{ secrets.ALGORITHM }}
        BOT_SECRET: ${{ secrets.BOT_SECRET }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/learningtracker_test
        DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/learningtracker_test
        DATABASE_URL_ALEMBIC: postgresql+psycopg://postgres:postgres@localhost:5432/learningtracker_test
        DATABASE_URL_ALEMBIC_TEST: postgresql+psycopg://postgres:postgres@localhost:5432/learningtracker_test

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install Poetry
          run: pip install poetry

        - name: Install dependencies
          run: poetry install --with dev --no-root
        - name: Run migrations
          run: poetry run alembic upgrade head

        - name: Run tests
          run: poetry run pytest -q api/tests